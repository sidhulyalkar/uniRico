name: Build Wavedash artifact

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build-wavedash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Wavedash handshake
        run: node tests/wavedash-adapter.js

      - name: Run target-language regression
        run: node tests/target-language.js

      - name: Run menu-rules regression
        run: node tests/menu-rules.js

      - name: Build Wavedash ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root = Path('.')
          out = root / 'dist' / 'uniRico-v0.17.0-wavedash.zip'
          out.parent.mkdir(exist_ok=True)
          files = [
              Path('index.html'),
              Path('src/style.css'),
              Path('src/levels.js'),
              *sorted(Path('src/runtime').glob('*.js')),
          ]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  z.write(path, path.as_posix())
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              assert names[0] == 'index.html'
              assert 'src/runtime/ui.js' in names
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          (out.with_suffix(out.suffix + '.sha256')).write_text(f'{digest}  {out.name}\n')
          print(f'{out}: {out.stat().st_size} bytes')
          print('SHA-256:', digest)
          PY

      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/uniRico-v0.17.0-wavedash.zip dist/uniRico-v0.17.0-wavedash.zip.sha256
          git diff --cached --quiet && exit 0
          git commit -m "build(wavedash): refresh v0.17.0 upload artifact"
          git push
