name: Competition candidate

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'dist/**'
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run readable-source regressions
        run: |
          for test in tests/*.js; do
            echo "==> $test"
            node "$test"
          done

      - name: Install deterministic competition tooling
        run: |
          python3 -m pip install zopfli
          npm install --global terser@5.50.0

      - name: Build js13k candidate
        run: |
          python3 tools/build_js13k_zip.py dist/uniRico-v0.18.0-js13k.zip
          sha256sum dist/uniRico-v0.18.0-js13k.zip > dist/uniRico-v0.18.0-js13k.zip.sha256

      - name: Verify one-file offline package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path = Path('dist/uniRico-v0.18.0-js13k.zip')
          with zipfile.ZipFile(path) as z:
              assert z.namelist() == ['index.html']
              html = z.read('index.html').decode()
              assert '<script src=' not in html
              assert '<link rel="stylesheet"' not in html
          print('offline one-file candidate: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: uniRico-v0.18.0-js13k
          path: |
            dist/uniRico-v0.18.0-js13k.zip
            dist/uniRico-v0.18.0-js13k.zip.sha256
          if-no-files-found: error

      - name: Commit exact candidate on branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/uniRico-v0.18.0-js13k.zip dist/uniRico-v0.18.0-js13k.zip.sha256
          git diff --cached --quiet && exit 0
          git commit -m "build(js13k): refresh v0.18.0 competition candidate"
          git push
