name: Competition candidate

on:
  push:
    branches: [main]
    paths:
      - 'src/style.css'
      - 'src/levels.js'
      - 'src/runtime/**'
      - 'tools/build_js13k_zip.py'
      - '.github/workflows/competition.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'src/style.css'
      - 'src/levels.js'
      - 'src/runtime/**'
      - 'tests/**'
      - 'tools/build_js13k_zip.py'
      - '.github/workflows/competition.yml'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: js13k-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIP_PATH: dist/uniRico-js13k.zip
  SHA_PATH: dist/uniRico-js13k.zip.sha256
  INFO_PATH: dist/uniRico-js13k-build.txt

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run readable-source regressions
        run: |
          for test in tests/*.js; do
            echo "==> $test"
            node "$test"
          done

      - name: Install deterministic competition tooling
        run: |
          python3 -m pip install zopfli
          npm install --global terser@5.50.0

      - name: Build canonical js13k candidate
        run: python3 tools/build_js13k_zip.py "$ZIP_PATH"

      - name: Record candidate provenance
        run: |
          sha256sum "$ZIP_PATH" > "$SHA_PATH"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "zip_bytes=$(stat -c%s "$ZIP_PATH")"
            echo "limit_bytes=13312"
            echo "sha256=$(cut -d' ' -f1 "$SHA_PATH")"
            echo "archive_entry=index.html"
          } > "$INFO_PATH"

      - name: Verify one-file offline package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path = Path('dist/uniRico-js13k.zip')
          with zipfile.ZipFile(path) as z:
              assert z.namelist() == ['index.html']
              html = z.read('index.html').decode()
              assert '<script src=' not in html
              assert '<link rel="stylesheet"' not in html
              assert len(z.read('index.html')) > 0
          assert path.stat().st_size <= 13_312
          print('offline one-file candidate: PASS')
          PY

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: uniRico-js13k-${{ github.sha }}
          path: |
            dist/uniRico-js13k.zip
            dist/uniRico-js13k.zip.sha256
            dist/uniRico-js13k-build.txt
          if-no-files-found: error

      - name: Commit canonical dist package to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ZIP_PATH" "$SHA_PATH" "$INFO_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "build(js13k): refresh competition dist for ${GITHUB_SHA::7}"

          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
            src/style.css src/levels.js src/runtime \
            tools/build_js13k_zip.py .github/workflows/competition.yml .gitignore; then
            echo "packaged game inputs advanced while this build was running; the newer main run will publish instead"
            exit 0
          fi

          git rebase origin/main
          git push origin HEAD:main
