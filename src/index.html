<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>uniRico — readable development build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c" aria-label="UNI:RICO rainbow ricochet game"></canvas>
  <div id="hud">
    <b>UNI:RICO</b><i></i>
    <span id="level">01/40</span><i></i>
    <span id="time">00:00.0</span><i></i>
    <span id="shots">S 0</span><i></i>
    <span id="stars">★ 000</span><i></i>
    <span id="score">00000</span>
  </div>

  <!-- Keep this order: game.js expects LEVELS/F0..F9 to exist. -->
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
